<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #202123; font-family: 'Noto Sans JP', sans-serif; padding: 16px 20px; }
  .label { font-size: 9px; color: #6b6b6b; text-transform: uppercase; letter-spacing: 0.08em; font-family: monospace; margin-bottom: 8px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .icon-cell { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; background: #2a2b2e; border-radius: 6px; }
  .emoji { font-size: 20px; line-height: 1; }
  .name { font-size: 9px; color: #6b6b6b; text-align: center; line-height: 1.2; }
</style></head>
<body>
  <div class="label">Emoji icon system (functional, not decorative)</div>
  <div class="grid">
    <div class="icon-cell"><span class="emoji">🔍</span><span class="name">検索 / About</span></div>
    <div class="icon-cell"><span class="emoji">⚠️</span><span class="name">診断 / Warning</span></div>
    <div class="icon-cell"><span class="emoji">📚</span><span class="name">ログ / Logs</span></div>
    <div class="icon-cell"><span class="emoji">📊</span><span class="name">統計 / Stats</span></div>
    <div class="icon-cell"><span class="emoji">📤</span><span class="name">エクスポート</span></div>
    <div class="icon-cell"><span class="emoji">🗑️</span><span class="name">削除 / Delete</span></div>
    <div class="icon-cell"><span class="emoji">🔗</span><span class="name">メニュー</span></div>
    <div class="icon-cell"><span class="emoji">🕒</span><span class="name">日時 / Time</span></div>
    <div class="icon-cell"><span class="emoji">🧾</span><span class="name">ログ一覧</span></div>
    <div class="icon-cell"><span class="emoji">📌</span><span class="name">注意 / Notice</span></div>
  </div>
</body></html>

<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  body { margin: 0; background: #202123; padding: 24px 32px; display: flex; flex-direction: column; gap: 20px; }
  .row { display: flex; gap: 20px; align-items: center; }
  .bg-dark { background: #202123; padding: 16px 24px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); }
  .bg-black { background: #000; padding: 16px 24px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); }
  .bg-light { background: #f5f5f5; padding: 16px 24px; border-radius: 8px; }
  img { display: block; }
  .label { font-size: 9px; color: #6b6b6b; text-transform: uppercase; letter-spacing: 0.08em; font-family: monospace; margin-bottom: 6px; }
</style></head>
<body>
  <div>
    <div class="label">Logo on dark (primary usage)</div>
    <div class="row">
      <div class="bg-dark"><img src="../assets/logo.svg" height="32" alt="Adalyze"></div>
      <div class="bg-black"><img src="../assets/logo.svg" height="32" alt="Adalyze"></div>
    </div>
  </div>
  <div>
    <div class="label">Logo sizes</div>
    <div class="row" style="align-items:flex-end">
      <div class="bg-dark" style="padding:10px 16px"><img src="../assets/logo.svg" height="48" alt="Adalyze"></div>
      <div class="bg-dark" style="padding:10px 16px"><img src="../assets/logo.svg" height="32" alt="Adalyze"></div>
      <div class="bg-dark" style="padding:8px 12px"><img src="../assets/logo.svg" height="20" alt="Adalyze"></div>
      <div class="bg-dark" style="padding:6px 10px"><img src="../assets/logo.svg" height="14" alt="Adalyze"></div>
    </div>
  </div>
</body></html>

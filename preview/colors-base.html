<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: #18191c; font-family: 'Noto Sans JP', sans-serif; padding: 16px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch { display: flex; flex-direction: column; gap: 4px; }
  .chip { width: 72px; height: 48px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.08); }
  .label { font-size: 10px; color: #9a9a9a; text-align: center; line-height: 1.3; }
  .val { font-size: 9px; color: #6b6b6b; text-align: center; font-family: monospace; }
  .section { margin-bottom: 12px; }
  .section-title { font-size: 10px; color: #6b6b6b; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
</style></head>
<body>
<div class="section">
  <div class="section-title">Backgrounds</div>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#000"></div><div class="label">Sidebar</div><div class="val">#000</div></div>
    <div class="swatch"><div class="chip" style="background:#202123"></div><div class="label">Main</div><div class="val">#202123</div></div>
    <div class="swatch"><div class="chip" style="background:#2a2b2e"></div><div class="label">Surface</div><div class="val">#2a2b2e</div></div>
    <div class="swatch"><div class="chip" style="background:#303236"></div><div class="label">Elevated</div><div class="val">#303236</div></div>
    <div class="swatch"><div class="chip" style="background:#4a4b50"></div><div class="label">Gray-500</div><div class="val">#4a4b50</div></div>
  </div>
</div>
<div class="section">
  <div class="section-title">Text</div>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#ffffff"></div><div class="label">Primary</div><div class="val">#fff</div></div>
    <div class="swatch"><div class="chip" style="background:#b0b0b0"></div><div class="label">Secondary</div><div class="val">#b0b0b0</div></div>
    <div class="swatch"><div class="chip" style="background:#9a9a9a"></div><div class="label">Tertiary</div><div class="val">#9a9a9a</div></div>
    <div class="swatch"><div class="chip" style="background:#6b6b6b"></div><div class="label">Muted</div><div class="val">#6b6b6b</div></div>
    <div class="swatch"><div class="chip" style="background:#cccccc"></div><div class="label">Unknown</div><div class="val">#ccc</div></div>
  </div>
</div>
</body></html>

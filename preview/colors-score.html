<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: #202123; font-family: 'Noto Sans JP', sans-serif; padding: 20px; }
  .row { display: flex; gap: 16px; align-items: stretch; }
  .card { flex: 1; border-radius: 10px; padding: 16px 14px; display: flex; flex-direction: column; gap: 6px; }
  .score-num { font-size: 32px; font-weight: 700; line-height: 1; }
  .score-label { font-size: 12px; font-weight: 500; opacity: 0.9; }
  .score-range { font-size: 10px; opacity: 0.6; margin-top: 2px; }
  .hex { font-size: 10px; font-family: monospace; opacity: 0.5; margin-top: auto; padding-top: 8px; }
</style></head>
<body>
<div class="row">
  <div class="card" style="background:rgba(46,184,178,0.12); border:1px solid rgba(46,184,178,0.3)">
    <div class="score-num" style="color:#2EB8B2">24</div>
    <div class="score-label" style="color:#2EB8B2">安全 — Safe</div>
    <div class="score-range" style="color:#2EB8B2">スコア 0–39</div>
    <div class="hex" style="color:#2EB8B2">#2EB8B2</div>
  </div>
  <div class="card" style="background:rgba(251,179,96,0.12); border:1px solid rgba(251,179,96,0.3)">
    <div class="score-num" style="color:#FBB360">58</div>
    <div class="score-label" style="color:#FBB360">注意 — Warning</div>
    <div class="score-range" style="color:#FBB360">スコア 40–69</div>
    <div class="hex" style="color:#FBB360">#FBB360</div>
  </div>
  <div class="card" style="background:rgba(205,66,70,0.12); border:1px solid rgba(205,66,70,0.3)">
    <div class="score-num" style="color:#CD4246">87</div>
    <div class="score-label" style="color:#CD4246">危険 — Danger</div>
    <div class="score-range" style="color:#CD4246">スコア 70–100</div>
    <div class="hex" style="color:#CD4246">#CD4246</div>
  </div>
</div>
</body></html>

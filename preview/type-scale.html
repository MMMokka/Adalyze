<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #202123; font-family: 'Noto Sans JP', sans-serif; padding: 20px; }
  .row { display: flex; flex-direction: column; gap: 10px; }
  .specimen { display: flex; align-items: baseline; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px; }
  .meta { font-size: 9px; color: #6b6b6b; font-family: monospace; min-width: 90px; flex-shrink: 0; line-height: 1.4; }
</style></head>
<body>
<div class="row">
  <div class="specimen">
    <div class="meta">5xl / 700<br>3rem · 48px</div>
    <div style="font-size:3rem;font-weight:700;color:#fff;line-height:1">危険スコア診断</div>
  </div>
  <div class="specimen">
    <div class="meta">3xl / 600<br>1.875rem · 30px</div>
    <div style="font-size:1.875rem;font-weight:600;color:#fff;line-height:1.1">広告文分析ツール</div>
  </div>
  <div class="specimen">
    <div class="meta">2xl / 600<br>1.5rem · 24px</div>
    <div style="font-size:1.5rem;font-weight:600;color:#fff">診断ログ一覧</div>
  </div>
  <div class="specimen">
    <div class="meta">xl / 500<br>1.25rem · 20px</div>
    <div style="font-size:1.25rem;font-weight:500;color:#fff">カテゴリを選択してください</div>
  </div>
  <div class="specimen">
    <div class="meta">md / 400<br>1rem · 16px</div>
    <div style="font-size:1rem;font-weight:400;color:#b0b0b0">本サービスの結果はあくまで参考情報です。</div>
  </div>
  <div class="specimen">
    <div class="meta">sm / 400<br>0.875rem · 14px</div>
    <div style="font-size:0.875rem;font-weight:400;color:#b0b0b0">広告文に個人情報・機密情報は入力しないでください。</div>
  </div>
  <div class="specimen">
    <div class="meta">xs / 400<br>0.75rem · 12px</div>
    <div style="font-size:0.75rem;font-weight:400;color:#6b6b6b">表示件数: 12 件 / 全件: 48 件</div>
  </div>
</div>
</body></html>

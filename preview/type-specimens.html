<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #202123; font-family: 'Noto Sans JP', sans-serif; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .block { display: flex; flex-direction: column; gap: 2px; }
  .label { font-size: 9px; color: #6b6b6b; text-transform: uppercase; letter-spacing: 0.08em; font-family: monospace; }
  .weights { display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  .w { color: #fff; font-size: 15px; }
</style></head>
<body>
  <div class="block">
    <div class="label">Noto Sans JP — weight scale</div>
    <div class="weights">
      <span class="w" style="font-weight:300">Light 300</span>
      <span class="w" style="font-weight:400">Regular 400</span>
      <span class="w" style="font-weight:500">Medium 500</span>
      <span class="w" style="font-weight:600">SemiBold 600</span>
      <span class="w" style="font-weight:700">Bold 700</span>
    </div>
  </div>
  <div class="block">
    <div class="label">Japanese characters</div>
    <div style="font-size:18px;color:#fff;font-weight:400;line-height:1.6">あいうえお　かきくけこ　さしすせそ<br>一二三四五六七八九十　副業・投資・美容</div>
  </div>
  <div class="block">
    <div class="label">IBM Plex Mono — code / data</div>
    <div style="font-family:'IBM Plex Mono',monospace;font-size:13px;color:#2EB8B2;line-height:1.5">危険スコア: 87/100<br>timestamp: 2026-04-24T12:00:00</div>
  </div>
</body></html>
